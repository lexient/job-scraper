[project]
name = "job-scraper"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.13",
    "beautifulsoup4>=4.12",
    "curl-cffi>=0.7",
    "lxml>=4.9",
    "markdownify>=0.11",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "sqlmodel>=0.0.22",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_scraper"]

[tool.ruff]
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = ["E501"]
